name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Complete SD Package
        run: |
          zip -r LonetLaunch-Complete-SD.zip atmosphere slaunch switch

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: LonetLaunch ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🌌 LonetLaunch ${{ github.ref_name }} - Complete Working Package
            
            Paquete completo con la arquitectura comprobada de reemplazo de HOME Menu para Nintendo Switch (Atmosphère).
            
            ### 🎮 ¿Qué incluye este paquete?
            - **sSystem (`atmosphere/contents/0100000000001000/`):** Daemon del sistema que gestiona el arranque, suspensión y llamadas de Horizon OS sin cuelgues ni pantallas negras.
            - **sMenu (`slaunch/bin/sMenu/`):** Menú gráfico acelerado por hardware (OpenGL) con vistas Grid, Coverflow, XMB y Shelf.
            - **Widgets en Lua y Música de fondo:** Widgets interactivos de reloj, clima y batería, más reproductor de audio nativo.
            - **sInstaller (`switch/sInstaller/`):** Instalador gráfico que puedes abrir directamente desde el Homebrew Menu.

            ---

            ### 🚀 ¿Cómo instalarlo?
            #### Opción A (Automática desde la Switch):
            Copia `switch/sInstaller/sInstaller.nro` a tu tarjeta SD, abre el Homebrew Menu en la Switch y presiona **Install**.
            
            #### Opción B (Manual):
            Descarga **`LonetLaunch-Complete-SD.zip`** y extrae las 3 carpetas (`atmosphere`, `slaunch`, `switch`) en la **raíz de tu tarjeta MicroSD**.
          files: |
            LonetLaunch-Complete-SD.zip
            switch/sInstaller/sInstaller.nro
